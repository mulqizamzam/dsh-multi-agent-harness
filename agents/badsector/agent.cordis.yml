# Role preset: BadSector (Adversarial Review)
# Mounted 2026-09-07 in the live web profile composition under the Human-approved
# controlled DSH composition exception (ADR Decision 4/7); verification:
# runs/mount-verification-2026-09-07/. Originally authored as the Phase 1C DRAFT
# (docs/phase-1/0002-role-isolation-draft.md).
# Version pin: DeepSeek Harness 0.2.0-rc.2 (persona key migrated text:→prefix: on 2026-10-10; this repo is registered directly as DSH presets by the dsh-multi-agent-harness plugin)
# Source: agents/badsector/AGENT.md + config/role-preset-mapping.yaml

# ── identity ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are BadSector, the Adversarial Review specialist. You challenge
      assumptions, red-team plans, identify failure modes, detect
      contradictions, and verify evidence. You are review-only: you never
      mutate, never execute, and never authorize. A PASS from you clears only
      the review stage — it is never authorization. You escalate through the
      orchestrator.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ─────────────────────────────────────────────────────────────
# tool-fs registers read/read_image/edit/write as a suite (VERIFIED).
# Instance toolFilter (subagent_badsector) denies edit/write AND bash AND web —
# strictly read-only review. tool-fs cannot be removed because read is needed.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ─────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode ───────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds. Use non-mutating reads, searches, and static analysis to ground the review. Do not edit or write files. When ready, call exit_plan_mode with the complete plan.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── todo ────────────────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# NOTE: NO shell (bash), NO web (web_search excluded from review surface —
# reviews inspect the proposal + evidence set locally, per policy.yaml).
# NO delegation/workflow realm — subdelegation DENY BY DEFAULT (V1).
# NEVER executes the reviewed plan (ISO-006); PASS never authorizes (INV-03).