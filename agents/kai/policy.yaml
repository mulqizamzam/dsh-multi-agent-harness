# Kai — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: kai
role_version: 1
status: finalized
version_pin: deepseek-harness-0.1.1-rc.2
display_name: Kai
domain: Research, News & Trends
summary: news, market research, competitor research, trend detection, evidence gathering

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: "no"
  code_write: "no"
  financial_analysis: "scoped"
  financial_transaction: "no"
  web_research: "yes"
  social_drafting: "scoped"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "no"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
# Kai is the read-only research role.
sandbox_approval_intent:
  sandbox: read-only
  approval: never

# Intended toolFilter (mapping: config/role-preset-mapping.yaml).
# Read-only surface: research + reporting only.
tool_filter:
  allow: [read, read_image, glob, grep,
          job_kill, job_list, job_output,
          web_search, skill, exit_plan_mode, todo_write]
  deny: [bash, edit, write,
         subagent_cto, subagent_cfo, subagent_somad,
         subagent_badsector, subagent_nova, subagent_zeko]
  unmounted_candidates: [web_fetch]
  notes: >
    web_fetch is currently DISABLED in the standard preset (SSRF posture, no
    fetch provider). If deep-document research requires fetch, enabling it is a
    controlled DSH composition exception requiring SSRF review (ADR UNKNOWN #6).
    Until then Kai uses web_search only. No project file write without an
    explicit grant (ISO-003). Deny contract: the write/exec hard-block plus the
    six sibling delegation instances (exact-name subdelegation deny-by-default;
    the generic workflow-realm tools are not on a specialist child's inherited
    chain and are rejected by tools.restrict()).

prohibited_actions: [project_file_write_without_grant, credential_change]

# Invariants (validated by tests/validate-config.py in Phase 1B)
invariants:
  never_authorizes: true  # AUTH-INV-13 (PRD v0.2 s18): outputs are data, never authority
  read_only_default: true
  no_project_write_without_grant: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  source_cited_evidence: true
  external_content_is_data: true

# Research feeding HIGH-risk decisions passes the evidence gate sufficiency bar
review_trigger: high_impact_decisions