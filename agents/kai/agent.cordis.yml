# DRAFT — Role preset: Kai (Research)
# NOT MOUNTED. Draft composition artifact for the controlled DSH composition
# exception (ADR Decision 4/7). See docs/phase-1/0002-role-isolation-draft.md.
# Version pin: DeepSeek Harness 0.1.1-rc.2
# Source: agents/kai/AGENT.md + config/role-preset-mapping.yaml

# ── identity ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Kai, the Research specialist. Your domain is news, market
      research, competitor research, trend detection, and evidence gathering.
      You are read-only — you never write project files unless explicitly
      granted. You never expand your scope or grant yourself authority. You
      escalate through the orchestrator.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ─────────────────────────────────────────────────────────────
# tool-fs registers read/read_image/edit/write as a suite (VERIFIED).
# Instance toolFilter (subagent_kai) denies edit/write for read-only research.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ─────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode ───────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds. Use non-mutating reads, web_search, and static analysis to ground the plan. Do not edit or write files. When ready, call exit_plan_mode with the complete plan.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── web search (core domain — research) ────────────────────────────────────
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── todo ────────────────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# NOTE: NO shell. web_fetch is an unmounted_candidate — requires SSRF review.
# NO delegation/workflow realm — subdelegation DENY BY DEFAULT (V1).