# Zeko — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: zeko
role_version: 1
status: finalized
version_pin: deepseek-harness-0.2.1-rc.2
display_name: Zeko
domain: Operations & Infrastructure
summary: server/runtime monitoring, process health, logs, deployment operations, operational recovery

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "yes"
  server_write: "scoped"
  code_read: scoped
  code_write: "no"
  financial_analysis: "no"
  financial_transaction: "no"
  web_research: "scoped"
  social_drafting: "no"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "scoped"
  destructive_action: "approval"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
# The session baseline is workspace-write + ask; these record least-privilege intent.
sandbox_approval_intent:
  sandbox: workspace-write
  approval: ask

# Intended tool surface (mapping: config/role-preset-mapping.yaml).
# allow = the role's model-facing tool surface, composed by the rows of this
# role's own Agent Preset. deny = hard prohibitions; unmounted_candidates =
# not mounted, requires a
# controlled composition exception before use.
tool_surface:
  # 2026-09-07 (Human-approved discriminator, task 3 of "laksanakan 1-4"):
  # edit/write removed — capabilities.code_write: no is now enforceable at the
  # tool-surface layer, not advisory. Ops writes are channel/script-routed; bash
  # remains for diagnosis (G10 residual, documented).
  allow: [bash, read, read_image, glob, grep,
          job_kill, job_list, job_output,
          web_search, skill, exit_plan_mode, todo_write]
  deny: []
  unmounted_candidates: []
  notes: >
    bash is scoped to ops diagnosis and delegation-bounded operations; ops
    file changes are channel-routed through the execution gate (edit/write
    removed from this role's allow on 2026-09-07 so the tool surface matches
    capabilities.code_write: no). Deny contract: the hard prohibitions named
    above are realised by the role's preset composition — a tool the role
    may not use is either not mounted or switched off by its plugin's
    per-tool config. Subdelegation is structural rather than a deny list:
    the preset mounts no delegation plugin, so a child of this role has no
    delegation tool in its catalog.

prohibited_actions: [code_architecture_change, financial_transaction, credential_change]

# Invariants (validated by tests/validate-config.py in Phase 1B)
invariants:
  never_authorizes: true  # AUTH-INV-13 (PRD v0.2 s18): outputs are data, never authority
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  execution_gate_required: true
  destructive_requires_approval: true
  no_code_architecture_change_without_scope: true

# When this role's output is HIGH-risk, BadSector review is mandatory
review_trigger: high_impact_and_destructive