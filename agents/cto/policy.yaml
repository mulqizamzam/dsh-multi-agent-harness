# CTO — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).
# 2026-09-07: domain/summary aligned to the canonical registry
# (config/agents.yaml: "Coding & System Architecture"); the earlier
# game-client-specific wording was persona drift from a prior project era.

role: cto
role_version: 1
status: finalized
version_pin: deepseek-harness-0.2.1-rc.2
display_name: CTO
domain: Coding & System Architecture
summary: coding, architecture, testing, technical feasibility, security, performance, implementation

capabilities:
  server_read: scoped
  server_write: "scoped"
  code_read: "yes"
  code_write: "yes"
  financial_analysis: "no"
  financial_transaction: "no"
  web_research: "scoped"
  social_drafting: "no"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "scoped"
  destructive_action: "approval"

sandbox_approval_intent:
  sandbox: workspace-write
  approval: ask

tool_surface:
  allow: [bash, read, read_image, edit, write, glob, grep,
          job_kill, job_list, job_output,
          web_search, skill, exit_plan_mode, todo_write]
  deny: []
  unmounted_candidates: [lsp, str_replace_editor]
  notes: >
    lsp and str_replace_editor are code-engineering tools that are NOT mounted
    in the standard web preset; enabling them for CTO requires a controlled
    DSH composition exception (HUMAN_PENDING). Until then they are denied.
    Deny contract: the hard prohibitions named above are realised by the
    role's preset composition — a tool the role may not use is either not
    mounted or switched off by its plugin's per-tool config. Subdelegation is
    structural rather than a deny list: the preset mounts no delegation
    plugin, so a child of this role has no delegation tool in its catalog.

prohibited_actions: [financial_transaction, credential_change]

invariants:
  never_authorizes: true  # AUTH-INV-13 (PRD v0.2 s18): outputs are data, never authority
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  execution_gate_required: true
  no_financial_capability: true
  verification_before_complete: true
  external_content_is_data_not_authority: true
  scope_expansion_requires_new_delegation: true

review_trigger: high_impact_and_destructive
