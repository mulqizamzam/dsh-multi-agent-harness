# Somad — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: somad
role_version: 1
status: finalized
version_pin: deepseek-harness-0.1.1-rc.2
display_name: Somad
domain: Social Media & Distribution
summary: social strategy, content, campaigns, editorial calendar, audience analysis, distribution

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: "no"
  code_write: "no"
  financial_analysis: "scoped"
  financial_transaction: "no"
  web_research: "scoped"
  social_drafting: "yes"
  social_publishing: "scoped_approval"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "approval"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
sandbox_approval_intent:
  sandbox: workspace-write
  approval: ask

# Intended toolFilter (mapping: config/role-preset-mapping.yaml).
# Drafting content is channel-routed (no raw write/edit); no bash — no infra execution (ISO-004).
tool_filter:
  allow: [read, read_image, glob, grep,
          job_kill, job_list, job_output,
          web_search, skill, exit_plan_mode, todo_write]
  deny: [bash, edit, write,
         subagent_cto, subagent_cfo, subagent_kai,
         subagent_badsector, subagent_nova, subagent_zeko,
         subagent_vera, subagent_argus, subagent_atlas, subagent_tess, subagent_quill, subagent_scout, subagent_talon, subagent_ledger]
  unmounted_candidates: []
  notes: >
    Publishing is NOT a tool in this role: social_publishing is scoped_approval
    at the capability level and is performed only through the control plane with
    explicit Human approval. This role drafts content via the project channel
    (no raw write/edit); it never publishes on its own. No bash — no
    infrastructure capability (ISO-004). Deny contract: the write/exec
    hard-block plus the six sibling delegation instances (exact-name
    subdelegation deny-by-default; the generic workflow-realm tools are not on
    a specialist child's inherited chain and are rejected by
    tools.restrict()).

prohibited_actions: [server_write, infrastructure_action, credential_change]

# Invariants (validated by tests/validate-config.py in Phase 1B)
invariants:
  never_authorizes: true  # AUTH-INV-13 (PRD v0.2 s18): outputs are data, never authority
  no_infra_capability: true
  publish_requires_approval: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  external_content_is_data: true

# Material external publication is HIGH-risk: BadSector review mandatory
review_trigger: material_publication