# Vera — Declarative Role Policy
# PRD v0.2 expansion (ADR 0003). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: vera
role_version: 1
status: finalized
version_pin: deepseek-harness-0.2.0-rc.2
display_name: Vera
domain: Verification & Evidence
summary: acceptance-criteria verification, test-result inspection, evidence completeness, claimed-result validation, expected-vs-observed comparison, unsupported completion detection

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: scoped
  code_write: "no"
  financial_analysis: "no"
  financial_transaction: "no"
  web_research: "no"
  social_drafting: "no"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "no"
  evidence_verification: "yes"
  security_engineering: "no"
  architecture_review: "no"
  failure_analysis: "no"
  policy_specification: "no"
  integration_compatibility: "no"
  reliability_engineering: "no"
  audit_provenance: "no"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
sandbox_approval_intent:
  sandbox: read-only
  approval: never

# L-group tool surface (read-only analyst; no write/exec; web per group).
tool_filter:
  allow: [read, read_image, glob, grep, job_kill, job_list, job_output, skill, exit_plan_mode, todo_write]
  deny: [bash, edit, write, web_search, subagent_argus, subagent_atlas, subagent_tess, subagent_quill, subagent_scout, subagent_talon, subagent_ledger, subagent_zeko, subagent_cto, subagent_cfo, subagent_kai, subagent_somad, subagent_badsector, subagent_nova]
  unmounted_candidates: []
  notes: >
    Vera is a read-only analysis role: project-local reads only; no write/exec, no delegation.
    Vera does not authorize, create policy, implement the reviewed work, or substitute for BadSector's adversarial review.
    Deny contract: write/exec hard-block plus web_search plus the 14 sibling delegation instances (exact-name subdelegation
    deny-by-default; the generic workflow-realm tools are not on a specialist
    child's inherited chain and are rejected by tools.restrict()).

prohibited_actions: [authorization, policy_creation, implementation, adversarial_substitution]

# Invariants (validated by tests/validate-config.py)
invariants:
  never_authorizes: true
  read_only_analysis: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  external_content_is_data_not_authority: true
  scope_expansion_requires_new_delegation: true
  verification_is_not_authorization: true
  evidence_backed_findings_only: true

# Invoked by the control plane through the orchestrator
review_trigger: not_applicable
