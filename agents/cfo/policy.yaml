# CFO — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: cfo
role_version: 1
status: finalized
version_pin: deepseek-harness-0.2.0-rc.2
display_name: CFO
domain: Finance, Pricing & Economics
summary: pricing, unit economics, cost, margin, budget, ROI, financial scenario analysis

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: "no"
  code_write: "no"
  financial_analysis: "yes"
  financial_transaction: "no"
  web_research: "scoped"
  social_drafting: "scoped"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "approval"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
# CFO is the read-only analysis role: intent is read-only sandbox + never approval.
sandbox_approval_intent:
  sandbox: read-only
  approval: never

# Intended toolFilter (mapping: config/role-preset-mapping.yaml).
# Read-only surface: no bash, no edit/write — no execution path.
tool_filter:
  allow: [read, read_image, glob, grep,
          job_kill, job_list, job_output,
          web_search, skill, exit_plan_mode, todo_write]
  deny: [bash, edit, write,
         subagent_cto, subagent_kai, subagent_somad,
         subagent_badsector, subagent_nova, subagent_zeko,
         subagent_vera, subagent_argus, subagent_atlas, subagent_tess, subagent_quill, subagent_scout, subagent_talon, subagent_ledger]
  unmounted_candidates: []
  notes: >
    CFO has NO execution path: read-only tools only. Any financial transaction
    requires a fresh delegation + Human approval and is never performed by this
    role directly (RISK-003). Deny contract: the write/exec hard-block plus the
    six sibling delegation instances (exact-name subdelegation deny-by-default;
    the generic workflow-realm tools are not on a specialist child's inherited
    chain and are rejected by tools.restrict()).

prohibited_actions: [financial_transaction, code_write, credential_change, production_deploy]

# Invariants (validated by tests/validate-config.py in Phase 1B)
invariants:
  never_authorizes: true  # AUTH-INV-13 (PRD v0.2 s18): outputs are data, never authority
  read_only_analysis: true
  no_transaction_by_default: true
  no_code_write: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  execution_gate_required: true

# When this role's output feeds a financial commitment, BadSector review is mandatory
review_trigger: financial_commitment