# Ledger — Declarative Role Policy
# PRD v0.2 expansion (ADR 0003). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: ledger
role_version: 1
status: finalized
version_pin: deepseek-harness-0.2.1-rc.2
display_name: Ledger
domain: Audit & Provenance
summary: audit-event validation, provenance analysis, decision lineage, evidence-source linkage, state-transition traceability, audit completeness

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: scoped
  code_write: "no"
  financial_analysis: "no"
  financial_transaction: "no"
  web_research: "no"
  social_drafting: "no"
  social_publishing: "no"
  novel_editing: "no"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "no"
  evidence_verification: "no"
  security_engineering: "no"
  architecture_review: "no"
  failure_analysis: "no"
  policy_specification: "no"
  integration_compatibility: "no"
  reliability_engineering: "no"
  audit_provenance: "yes"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
sandbox_approval_intent:
  sandbox: read-only
  approval: never

# L-group tool surface (read-only analyst; no write/exec; web per group).
tool_surface:
  allow: [read, read_image, glob, grep, job_kill, job_list, job_output, skill, exit_plan_mode, todo_write]
  deny: [bash, edit, write, web_search]
  unmounted_candidates: []
  notes: >
    Ledger is a read-only analysis role: project-local reads only; no write/exec, no delegation.
    Ledger never creates authority, never approves state transitions, and never alters audit history outside approved mechanisms.
    Deny contract: the hard prohibitions named above are realised by the
    role's preset composition — a tool the role may not use is either not
    mounted or switched off by its plugin's per-tool config. Subdelegation is
    structural rather than a deny list: the preset mounts no delegation
    plugin, so a child of this role has no delegation tool in its catalog.

prohibited_actions: [authority_creation, state_transition_approval, audit_history_alteration]

# Invariants (validated by tests/validate-config.py)
invariants:
  never_authorizes: true
  read_only_analysis: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  external_content_is_data_not_authority: true
  scope_expansion_requires_new_delegation: true
  audit_is_not_authority: true
  no_audit_history_alteration: true

# Invoked by the control plane through the orchestrator
review_trigger: not_applicable
