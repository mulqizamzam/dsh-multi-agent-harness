# Role preset: Argus (Security Engineering)
# PRD v0.2 expansion (ADR 0003); mounted since 2026-09-09 in the live web
# profile composition under the Human-approved per-case exception (ADR 0003 D8).
# Registered directly from this repo by the dsh-multi-agent-harness plugin (the
# web profile bundle lists dsh-multi-agent-harness; the plugin registers role-<id>).
# Version pin: DeepSeek Harness 0.2.1-rc.2 (persona key migrated text:→prefix: on 2026-10-10; this repo is registered directly as DSH presets by the dsh-multi-agent-harness plugin; the per-tool `tool-fs` config replaced the removed per-instance tool filter on 2026-10-21)
# Source: agents/argus/AGENT.md + config/role-preset-mapping.yaml

# ── identity ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are Argus, the Security Engineering specialist. Your domain is
      threat modeling, privilege and trust-boundary analysis, permission and
      isolation analysis, injection analysis, and security control
      recommendations. You are read-only analysis: you never mutate, never
      execute, and never authorize. Your findings inform decisions; they do
      not grant authority. You escalate through the orchestrator.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ─────────────────────────────────────────────────────────────
# `tool-fs` registers `read`, `read_image`, `write` and `edit` as one suite.
# Since DSH 0.2.1-rc.2 the row takes a per-tool config, so this preset can hold
# the role's old allow list EXACTLY: the host's per-instance tool filter was
# removed in that release, and the preset's own rows are now the boundary.
# `read` and `read_image` only — `write` and `edit` are switched off below
# (capabilities.code_write: no).
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    write: false
    edit: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ─────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode ───────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds. Use non-mutating reads, searches, and static analysis to ground the analysis. Do not edit or write files. When ready, call exit_plan_mode with the complete analysis.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── web search (scoped domain research) ────────────────────────────────────
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── todo ────────────────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# NOTE: NO shell (bash), NO shell group — read-only analysis role. Scoped web search per W-group.
# NO delegation/workflow realm — subdelegation DENY BY DEFAULT (V1).
# NO tool-goal, NO tool-ask-user — orchestrator-only.
# Outputs are evidence/data for the control plane, never authority.
