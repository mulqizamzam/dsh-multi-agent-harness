# pytest.ini — project pytest configuration
#
# PURPOSE: fail-fast by default (G13 live-execution gate axis 7 / recheck axis 9).
#
# A live adversarial security run (the canonical 63-scenario G13 package) must
# STOP at the first unexpected failure so that a failing scenario cannot
# cascade state contamination into the remaining scenarios. The gate probes
# for `-x` / `maxfail=1` in a pytest config file at the project root:
#   tests/g13/gate/test_g13_live_execution_gate.py::gate_verdict  (axis 7)
#   tests/g13/gate/test_g13_live_recheck.py::recheck_verdict      (axis 9)
# Requirement source: docs/phase-5/security/g13/gate/0001 §7 and 0002 §9/B6.
#
# Fail-fast is the SAFE DEFAULT, so it is set here rather than relied upon in a
# documented invocation that an operator could forget.
#
# FULL-SUITE REGRESSION RUNS must opt out explicitly so that complete pass/fail
# counts are still obtainable:
#
#     .venv-tests/bin/python -m pytest tests/ -q --maxfail=0
#
# (Verified: a CLI `--maxfail=0` overrides `addopts = -x`.)
#
# Nothing here changes test collection, test selection, or any assertion.
# No test is weakened, skipped, or deselected by this file.

[pytest]
addopts = -x -n auto
