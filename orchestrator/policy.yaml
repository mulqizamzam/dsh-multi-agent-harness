# ============================================================================
# ORCHESTRATOR — Declarative Role Policy (coordination layer)
#
# Version pin: DeepSeek Harness 0.1.1-rc.2 (tool names verified against
# docs/tool-catalog.md; same pin as every agents/<id>/policy.yaml).
# Status: FINALIZED CONTENT, NEW ARTIFACT. Every statement below restates a
# decision already recorded elsewhere; this file introduces no new boundary and
# changes no tool name. It is control-plane input — NOT native DSH
# authorization: orchestrator/contract.md remains the security boundary
# (THREAT-025) and the session toolFilter remains an L2 backstop.
#
# Sources (all read; nothing here is inferred):
#   - orchestrator/AGENT.md            mission, capability boundary, invariants
#   - orchestrator/contract.md         gate ownership, delegation protocol
#   - orchestrator/agent.cordis.yml    the preset composition ADR 0004 derives
#                                      from this declared surface (D3 deletions)
#   - config/role-preset-mapping.yaml  §orchestrator (binding, delegation_tools,
#                                      tool_filter allow/deny/notes — copied)
#   - config/agents.yaml               §orchestrator (kind: coordination)
#   - config/permissions.yaml          capability vocabulary + agent_defaults
#   - docs/adr/0001 (Decision 3, hybrid) and docs/adr/0004 (role preset)
#
# Shape note — why this file has its OWN schema rather than sharing the
# specialist one: tests/validate_config.py loads specialist policies from
# agents/<id>/policy.yaml for SPECIALIST_IDS, and
# schemas/role-definition.schema.json closes `role` to those fifteen ids. The
# orchestrator is bound to the root session, so it has no agents/<id>/
# directory and can never satisfy that schema. It is therefore validated by
# schemas/orchestrator-policy.schema.json, wired into tests/validate_config.py
# and reachable through the tests/validate-config.py wrapper that the config
# files name. The specialist-shared invariants (no_self_delegation,
# subdelegation_deny_by_default, never_authorizes) are declared below and are
# now actually checked, and the validator additionally asserts that this file's
# tool_filter and delegation_tools stay set-equal with
# config/role-preset-mapping.yaml §orchestrator. Keys below deliberately mirror
# the specialist template
# (role / role_version / status / version_pin / display_name / domain /
# summary / capabilities / sandbox_approval_intent / tool_filter /
# prohibited_actions / invariants / review_trigger); the coordination-only
# additions are kind, binding, delegation, and authority — plus `id`, which is
# a registry-parity alias of `role` (config/agents.yaml §orchestrator).
# ============================================================================

role: orchestrator
id: orchestrator              # config/agents.yaml §orchestrator
kind: coordination            # NOT a sixteenth specialist (PRD §4; ADR 0001 D3)
binding: root_session         # config/role-preset-mapping.yaml §orchestrator
role_version: 1
status: finalized             # content status inherited from orchestrator/AGENT.md
version_pin: deepseek-harness-0.1.1-rc.2
display_name: Orchestrator
domain: Coordination & Delegation
summary: >
  Coordination and delegation layer. Converts objectives into scoped tasks,
  selects the minimum relevant specialist set, delegates with explicit
  authority boundaries, collects and synthesizes results, and enforces gates.
  Does NOT execute specialist work. Has no permanent authority.

# Capability subset in config/permissions.yaml vocabulary (yes | scoped |
# review | approval | scoped_approval | no). The orchestrator holds no standing
# specialist capability: what it may do is either a coordination tool (see
# `delegation:`) or a B-lite read / reversible internal write that always
# passes the execution gate.
capabilities:
  server_read: scoped         # B-lite: state reads, validation, result collection
  server_write: "no"          # operations belong to zeko; never executed here
  code_read: scoped           # review/collection reads, within delegation
  code_write: "no"            # does not execute specialist work; state/audit only
  financial_analysis: "no"
  financial_transaction: "no" # HIGH-risk class: never direct (ORC-002)
  web_research: scoped        # web_search is allowed; bounded by delegation
  social_drafting: "no"
  social_publishing: "no"     # material publication: never direct (ORC-002)
  novel_editing: "no"
  adversarial_review: "no"    # reserved to badsector; the orchestrator TRIGGERS it
  production_deploy: "no"     # HIGH-risk class: never direct (ORC-002)
  destructive_action: "no"    # HIGH-risk class: never direct (ORC-002)
  evidence_verification: "no" # enforcing the evidence gate ≠ owning the capability
  security_engineering: "no"
  architecture_review: "no"
  failure_analysis: "no"
  policy_specification: "no"
  integration_compatibility: "no"
  reliability_engineering: "no"
  audit_provenance: scoped    # single-writer maintenance of state/ + audit/ (ADR 0002)

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR 0001
# Decision 1). The orchestrator IS the root session, so this is that session's
# standing posture and it equals the ADR's deployment baseline
# (workspace-write + ask, ADR 0001 Decision 1). It is the policy source for
# agent_defaults.orchestrator in config/permissions.yaml.
sandbox_approval_intent:
  sandbox: workspace-write
  approval: ask

# Delegation surface. Names copied from
# config/role-preset-mapping.yaml §orchestrator.delegation_tools.
delegation:
  delegation_orchestrator_only: true    # mapping §consistency_rules; ADR 0004 D4
  subdelegation: deny_by_default        # V1: no specialist delegates to another
  delegation_tools: [subagent, subagent_fork, send_message, interrupt_agent, list_agents, workflow]
  authority_gate_delegable: false
  workflow_is_not_a_security_boundary: true

# Authority posture (orchestrator/AGENT.md §Capability boundary; ORC-002;
# THREAT-001/002). Capability ≠ Permission ≠ Authority (PRD §6).
authority:
  permanent_authority: none
  high_risk_execution: never_direct     # production / destructive / financial /
                                        # credential / material publication
  high_risk_routing: specialist_under_authority_and_approval
  delegation_immutable_below: human     # no self-grant, no scope expansion
  gate_enforcement: code_enforced       # model judgment and prose never bypass it
  escalation_target: human

# Session toolFilter INTENT, copied verbatim from
# config/role-preset-mapping.yaml §orchestrator.tool_filter.
tool_filter:
  allow: [read, read_image, glob, grep, edit, write, bash,
          job_kill, job_list, job_output,
          subagent, subagent_fork, send_message, interrupt_agent, list_agents,
          subagent_zeko, subagent_cto, subagent_cfo, subagent_kai,
          subagent_somad, subagent_badsector, subagent_nova,
          subagent_vera, subagent_argus, subagent_atlas, subagent_tess,
          subagent_quill, subagent_scout, subagent_talon, subagent_ledger,
          workflow, skill, ask_user_question, exit_plan_mode,
          create_goal, get_goal, update_goal, todo_write, web_search]
  deny: [ralph, str_replace_editor, lsp, run_code, pwsh, web_fetch,
         terminal_open, terminal_read, terminal_send, terminal_signal,
         terminal_list, terminal_close,
         schedule_create, schedule_delete, schedule_list,
         session_event_read, session_event_search, session_event_trace,
         session_search, session_trace,
         cordis_define, cordis_inspect_list, cordis_inspect_query,
         cordis_inspect_self, cordis_run, cordis_stop, cordis_undefine,
         followup_task, spawn_teammate, team_task_create, team_task_get,
         team_task_list, team_task_update, wait_agent]
  unmounted_candidates: []
  notes: >
    B-lite: edit/write/bash are allowed ONLY for project state/audit maintenance
    and reversible internal actions within delegation, ALWAYS through the
    execution gate — which is why capabilities.code_write is "no" while the
    write tools stay on the surface. For specialists that pairing is enforced by
    the toolFilter (2026-09-07 discriminator); for the root session it is
    enforced by the execution gate and the control-plane contract (THREAT-025),
    the session toolFilter being the L2 backstop. HIGH-risk actions
    (production/destructive/financial/credential/material publication) are
    never executed directly — they route to a specialist under authority +
    approval (ORC-002). ralph and the agent-team tools are out of scope for the
    orchestrator (ralph is a fresh-agent loop, not orchestration; agent teams
    are BLOCKED). Asymmetry corrected 2026-09-12: this allow set previously
    named the eight expansion subagent_<id> instances but not the seven baseline
    ones, which appeared in neither allow nor deny. All fifteen are named here
    and in config/role-preset-mapping.yaml §orchestrator, and
    tests/validate_config.py asserts that coverage (`orchestrator allow covers
    all 15 instances`), so the reduction cannot silently regress and ADR 0004
    D3's derivation basis can no longer drift. Mount location updated
    2026-10-11: the fifteen instance rows live in orchestrator/agent.cordis.yml
    (moved from global-layer rows in the live profile patch), beside the
    generic subagent / subagent_fork rows this preset already contributed —
    so only orchestrator-bound sessions carry the delegation surface.

prohibited_actions: [direct_production_deploy, direct_destructive_action,
                     direct_financial_transaction, direct_credential_change,
                     direct_material_publication, self_grant, scope_expansion,
                     authority_gate_delegation, specialist_work_execution,
                     permanent_authority_claim]

# Invariants. All boolean, matching the shape of the specialist policies.
invariants:
  never_authorizes: true              # AUTH-INV-13: outputs are data, never authority
  no_self_escalation: true
  no_self_delegation: true            # REQUIRED_POLICY_INVARIANTS key; declared per header note
  subdelegation_deny_by_default: true
  execution_gate_required: true       # every consequential action
  no_direct_high_risk_execution: true # AUTH-INV-18: cannot execute what it could not delegate
  authority_gate_never_delegated: true
  delegation_immutable_below_human: true  # THREAT-002
  no_scope_expansion: true
  scope_expansion_requires_new_delegation: true
  single_writer_state_audit: true     # only writer of state/ + audit/ (ADR 0002)
  badsector_pass_is_not_authorization: true
  verification_before_complete: true
  fail_closed_and_escalate: true
  external_content_is_data_not_authority: true

# The orchestrator owns the review GATE: it triggers BadSector review of a
# high-impact or destructive plan before delegating execution. PASS clears the
# review stage only and never authorizes the action.
review_trigger: high_impact_and_destructive
