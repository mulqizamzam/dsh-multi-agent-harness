# ============================================================================
# ROLE → AGENT PRESET / TOOL SURFACE MAPPING — multi-agent-harness
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
#
# This file declares, for each role, the DSH Agent Preset that carries it and
# the tool surface that preset is composed of. It is the bridge between the
# project role definitions (agents/<id>/AGENT.md + policy.yaml) and DSH Agent
# Presets.
#
# MODEL (DSH 0.2.1-rc.2 — rewritten 2026-10-21):
#   A role is reached by SELECTING AN AGENT PRESET on the one delegation tool.
#   The host removed the per-instance `persona` and `toolFilter` config keys
#   from `@deepseek-ai/dsh-tool-subagent` — it now throws on them — and it
#   removed `backgroundMode`. Fifteen model-facing `subagent_<id>` tools
#   became one `subagent` tool whose `agent_preset` argument names the role.
#
#   A role's tool surface is therefore the set of TOOL PLUGINS its preset
#   mounts, not a list of tool names in a runtime filter:
#     bash                            -> @deepseek-ai/dsh-tool-bash
#     read, read_image                -> @deepseek-ai/dsh-tool-fs
#     write, edit                     -> @deepseek-ai/dsh-tool-fs
#     glob, grep                      -> @deepseek-ai/dsh-tool-fs-search
#     job_kill, job_list, job_output  -> @deepseek-ai/dsh-tool-jobs
#     skill                           -> @deepseek-ai/dsh-tool-skill
#     exit_plan_mode                  -> @deepseek-ai/dsh-plan-mode
#     web_search, web_fetch           -> @deepseek-ai/dsh-tool-web
#     todo_write                      -> @deepseek-ai/dsh-tool-todo
#   `@deepseek-ai/dsh-tool-fs` narrows itself per tool (`read` / `readImage` /
#   `write` / `edit`) and `@deepseek-ai/dsh-tool-web` narrows itself with
#   `search` / `fetch`, so a preset reproduces the exact tool list its role
#   had — the granularity loss of the removed `toolFilter` does not apply to
#   any tool this roster uses.
#
# IMPORTANT:
#  - PRD v0.2 expansion (2026-09-09, ADR 0003): eight new roles (vera,
#    argus, atlas, tess, quill, scout, talon, ledger) are REGISTERED here
#    (mapping_version 3) and their presets are mounted by the
#    dsh-multi-agent-harness plugin, which registers `role-<id>` directly from
#    this repo since 2026-10-10. The delegation tool that selects them is the
#    single `subagent` row in orchestrator/agent.cordis.yml.
#  - Tool names are verified against the DSH 0.2.1-rc.2 tool catalog. The
#    fifteen `subagent_<id>` names are GONE: there is one delegation tool per
#    provider, so there is no per-sibling tool to name.
#  - SUBDelegation DENY BY DEFAULT is now STRUCTURAL, not a deny list: a
#    specialist's preset mounts no delegation plugin at all, so the child has
#    no delegation tool in its catalog, and the delegation tool's
#    `maxDepth: 1` rejects a second hop at start. The old deny lists that
#    named the fourteen sibling instances are therefore obsolete and removed.
#  - The `tool_surface` block below is the role's model-facing tool surface,
#    realised by the rows of its preset composition. It is a CAPABILITY
#    boundary, not complete security isolation; sandbox/approval remain
#    session-level.
#  - Validation (tests/validate_config.py) asserts: allow ∩ deny = ∅, every
#    name in the verified catalog, consistency with agents/<id>/policy.yaml,
#    and that each role's allow list matches the tool plugins its preset
#    actually mounts.
# ============================================================================

mapping_version: 3
status: finalized
version_pin: deepseek-harness-0.2.1-rc.2
documentation_ref: docs/tool-catalog.md
preset_naming_convention: 'role-<id>'          # Agent Preset id for the 15 specialists
                                               # (authored + mounted; see draft_artifacts.status).
                                               # Does NOT cover the orchestrator — see
                                               # draft_artifacts.orchestrator_preset (ADR 0004).
instance_naming_convention: 'subagent'         # the ONE delegation tool the orchestrator holds;
                                               # a role is selected by the model-facing
                                               # `agent_preset` argument, which carries the
                                               # `role-<id>` preset id.

# Roles are exposed to the orchestrator as AGENT PRESETS the single delegation
# tool can select. All specialists: provider spawn, max_depth 1 (no further
# delegation — subdelegation DENY BY DEFAULT, V1, enforced by the provider and
# by the absence of any delegation plugin in a specialist's preset).
roles:
  - id: zeko
    preset: role-zeko
    policy_ref: agents/zeko/policy.yaml
    tool_instance:
      tool_name: subagent
      provider: spawn
      max_depth: 1
      agent_preset: role-zeko
    tool_surface:
      # 2026-09-07 (Human-approved discriminator): edit/write removed from
      # zeko — capabilities.code_write: no is now enforceable at the tool-surface
      # layer (the role's preset mounts @deepseek-ai/dsh-tool-fs with
      # write/edit switched off). Raw-write actor set narrows {zeko, cto} ->
      # {cto}; G10 residual now rests on cto alone.
      allow: [bash, read, read_image, glob, grep,
              job_kill, job_list, job_output,
              web_search, skill, exit_plan_mode, todo_write]
      deny: []
    notes: ops role; bash scoped to diagnosis/delegation-bounded ops; no code architecture change; edit/write channel-routed (2026-09-07 discriminator)

