# ============================================================================
# ROLE → PRESET / TOOLFILTER MAPPING — multi-agent-harness
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
#
# This file declares, for each role, the intended DSH Agent Preset and the
# per-role `tool-subagent` instance configuration (toolName, toolFilter,
# persona, backgroundMode, maxDepth) that the control plane will mount in a
# later phase. It is the bridge between the project role definitions
# (agents/<id>/AGENT.md + policy.yaml) and DSH Agent Presets.
#
# IMPORTANT:
#  - NOTHING here is mounted. Mounting per-role presets/instances is a
#    controlled DSH composition exception (ADR Decision 4/7 — HUMAN_PENDING,
#    reversible per case).
#  - Tool names are verified against the DSH 0.1.1-rc.2 tool catalog
#    (docs/tool-catalog.md). Unknown names fail loudly at mount (VERIFIED).
#  - toolFilter is a CAPABILITY boundary, not complete security isolation;
#    sandbox/approval remain session-level.
#  - Phase-1B validation tests must assert: allow ∩ deny = ∅, every name in
#    the verified catalog, and consistency with agents/<id>/policy.yaml.
# ============================================================================

mapping_version: 1
status: finalized
version_pin: deepseek-harness-0.1.1-rc.2
documentation_ref: docs/tool-catalog.md
preset_naming_convention: 'role-<id>'          # Agent Preset directory id (not yet authored)
instance_naming_convention: 'subagent_<id>'   # per-role tool-subagent toolName

# Roles are exposed to the orchestrator via per-role tool-subagent instances.
# All specialists: provider spawn, continuable (report channel available),
# max_depth 1 (no further delegation — subdelegation DENY BY DEFAULT, V1).
roles:
  - id: zeko
    preset: role-zeko
    policy_ref: agents/zeko/policy.yaml
    tool_instance:
      tool_name: subagent_zeko
      provider: spawn
      background_mode: continuable
      max_depth: 1
      persona: role-zeko
    tool_filter:
      allow: [bash, read, read_image, edit, write, glob, grep,
              job_kill, job_list, job_output,
              web_search, skill, exit_plan_mode, todo_write]
      deny: [subagent, subagent_fork, send_message, interrupt_agent, list_agents,
             workflow, ralph, ask_user_question,
             create_goal, get_goal, update_goal]
    notes: ops role; bash scoped to diagnosis/delegation-bounded ops; no code architecture change

