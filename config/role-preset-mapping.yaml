# ============================================================================
# ROLE → PRESET / TOOLFILTER MAPPING — multi-agent-harness
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
#
# This file declares, for each role, the intended DSH Agent Preset and the
# per-role `tool-subagent` instance configuration (toolName, toolFilter,
# persona, backgroundMode, maxDepth) that the control plane will mount in a
# later phase. It is the bridge between the project role definitions
# (agents/<id>/AGENT.md + policy.yaml) and DSH Agent Presets.
#
# IMPORTANT:
#  - PRD v0.2 expansion (2026-09-09, ADR 0003): eight new roles (vera,
#    argus, atlas, tess, quill, scout, talon, ledger) are REGISTERED here
#    (mapping_version 2). Their tool-subagent instances are NOT yet mounted
#    in the live profile: mount is the separate Human per-case exception
#    (ADR 0003 D8). Registration is not activation.
#  - Mounted 2026-09-07: per-role presets/instances ARE mounted in the live
#    web profile composition under the Human-approved D4/D7 exception
#    (ADR Decision 4/7; verification: runs/mount-verification-2026-09-07/).
#    Composition changes per case remain a controlled, reversible exception.
#  - Tool names are verified against the DSH 0.1.1-rc.2 tool catalog
#    (docs/tool-catalog.md) plus the seven deployed per-role instance tools
#    (subagent_<id>, mounted as global-layer rows in the live profile
#    composition). Unknown names fail loudly at child spawn:
#    tools.restrict() throws on any allow/deny name outside the child's
#    inherited tool surface (global layer + parent scope chain).
#  - DENY CONTRACT (canonical; reconciled with the deployed live profile):
#    every deny list names exactly the fourteen sibling subagent_<id> instances
#    (the real delegation surface — restriction matching is exact-name, so
#    denying the generic "subagent" never blocked subagent_<id>) plus the
#    role-specific bash/edit/write/web_search prohibitions below. Generic
#    workflow-realm tools (subagent, subagent_fork, send_message,
#    interrupt_agent, list_agents, workflow, ralph) are NOT valid deny
#    entries: they register in the standard preset's workflow isolate realm,
#    outside a specialist child's inherited chain, and restrict() rejects
#    them. Every other catalog tool is withheld by the closed allow list —
#    allow is the primary boundary; deny is the exact-name hard block.
#  - toolFilter is a CAPABILITY boundary, not complete security isolation;
#    sandbox/approval remain session-level.
#  - Phase-1B validation tests must assert: allow ∩ deny = ∅, every name in
#    the verified catalog, and consistency with agents/<id>/policy.yaml.
# ============================================================================

