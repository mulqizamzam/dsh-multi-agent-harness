# The orchestrator is the root session (ADR Decision 3 hybrid), not a
# tool-subagent instance. Its own session toolFilter is a deployment concern
# (L2 backstop); the control-plane contract (orchestrator/contract.md) is the
# actual security boundary (THREAT-025). B-lite carve-out: read-only /
# reversible internal actions within delegation, always through the execution
# gate; never direct HIGH-risk execution.
orchestrator:
  id: orchestrator
  binding: root_session
  policy_ref: orchestrator/AGENT.md
  delegation_tools: [subagent, subagent_fork, send_message, interrupt_agent, list_agents, workflow]
  tool_filter:
    allow: [read, read_image, glob, grep, edit, write, bash,
            job_kill, job_list, job_output,
            subagent, subagent_fork, send_message, interrupt_agent, list_agents,
            subagent_vera, subagent_argus, subagent_atlas, subagent_tess,
            subagent_quill, subagent_scout, subagent_talon, subagent_ledger,
            workflow, skill, ask_user_question, exit_plan_mode,
            create_goal, get_goal, update_goal, todo_write, web_search]
    deny: [ralph, str_replace_editor, lsp, run_code, pwsh, web_fetch,
           terminal_open, terminal_read, terminal_send, terminal_signal,
           terminal_list, terminal_close,
           schedule_create, schedule_delete, schedule_list,
           session_event_read, session_event_search, session_event_trace,
           session_search, session_trace,
           cordis_define, cordis_inspect_list, cordis_inspect_query,
           cordis_inspect_self, cordis_run, cordis_stop, cordis_undefine,
           followup_task, spawn_teammate, team_task_create, team_task_get,
           team_task_list, team_task_update, wait_agent]
    notes: >
      B-lite: edit/write/bash allowed ONLY for project state/audit maintenance
      and reversible internal actions within delegation, ALWAYS through the
      execution gate. HIGH-risk actions (production/destructive/financial/
      credential/material publication) are never executed directly — they route
      to a specialist under authority + approval (ORC-002). ralph and
      agent-team tools are out of scope for the orchestrator (ralph is a
      fresh-agent loop, not orchestration; agent teams are BLOCKED/out of scope).

# Consistency guardrails (validated by Phase-1B tests):
consistency_rules:
  allow_deny_disjoint: true
  tool_names_verified: true        # against docs/tool-catalog.md (0.1.1-rc.2)
  matches_role_policy_yaml: true   # each role's allow/deny matches agents/<id>/policy.yaml
  delegation_orchestrator_only: true   # subdelegation DENY BY DEFAULT (V1)
  specialist_max_depth_1: true

# ── Phase 1C draft references ───────────────────────────────────────────────
# The controlled DSH composition exception (ADR D4/D7) was Human-approved
# 2026-09-07 and executed: the seven subagent_<id> rows are mounted in the
# live web profile composition ($DSH_HOME/profiles/web/cordis.patch.yml) and
# verified (runs/mount-verification-2026-09-07/). The draft register below is
# retained for provenance; see docs/phase-1/0002-role-isolation-draft.md.
draft_artifacts:
  status: mounted                      # 2026-09-07: 7 baseline (D4/D7); 2026-09-09: + 8 expansion (ADR 0003 D8) — all 15 mounted
  preset_draft_path: 'agents/<id>/agent.cordis.yml'   # per-role preset composition
  instances_draft_path: config/tool-subagent-instances.yaml  # per-role tool-subagent rows
  orchestrator_preset: orchestrator   # ADR 0004 D1: the orchestrator composes its own preset
                                      # (derived from shipped `standard`; see docs/adr/0004),
                                      # deployed at $DSH_HOME/.agent-presets/orchestrator/.
                                      # Declared HERE, not on the `orchestrator:` entry: that
                                      # entry's schema (schemas/role-mapping.schema.json,
                                      # $defs.orchestratorEntry) is additionalProperties:false,
                                      # and preset_naming_convention 'role-<id>' does not cover
                                      # the orchestrator (its id is `orchestrator`, not
                                      # `role-orchestrator`) — so the binding is not derivable.
                                      # D5: agent-presets.default in settings.yaml stays
                                      # `standard` — selection is a per-session Human choice.
  mount_required: false               # exceptions already executed; no further mount required
