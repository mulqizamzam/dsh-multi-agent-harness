# ============================================================================
# PERMISSION MATRIX — multi-agent-harness
# Phase 1 (Foundation) + PRD v0.2 specialist pool expansion (v2)
#
# This file defines the TECHNICAL CAPABILITY BOUNDARY for each agent
# (PRD §8 + PRD v0.2 §12). It answers: what may this agent technically do
# in the system?
#
# It does NOT grant project/action authority. Authority today is carried by
# Human delegation records (state/registry/) and the control-plane code
# (`control/authority.py`, `control/risk.py`); a dedicated `authority.yaml` /
# risk-policy layer is PLANNED (see docs/phase-1/0001), not yet authored.
# Capability ≠ Permission ≠ Authority (PRD §6).
#
# Vocabulary (normalized from PRD §8):
#   yes             always permitted (still bounded by sandbox + delegation)
#   scoped          permitted ONLY within an explicit, project-scoped delegation
#   review          read-only access for review purposes (no mutation, no execution)
#   approval        permitted ONLY with explicit human approval per action
#   scoped_approval scoped AND requires human approval per action
#   no              not permitted
#
# Tool names are DSH tool-catalog entries verified in Phase 0
# (docs/tool-catalog.md, v0.1.1-rc.2). See docs/operations.md for the mapping.
#
# v2 (2026-09-09, PRD v0.2 / ADR 0003 D5): 8 new capability rows re-declare
# overlapping competence that stays anchored to its ORIGINAL role
# (badsector keeps review-class coverage on evidence/security/failure; cto
# keeps scoped security/architecture/integration; zeko keeps scoped
# failure/reliability). New roles own their primary capability.
#
# 2026-09-12 addendum (ADR 0004): the orchestrator is recorded in
# `agent_defaults` below (its root-session sandbox/approval posture, annotated
# in place) and in `orchestrator_boundary_note` below that. It is NOT added to
# `agents:` or to any capability row: the matrix is a specialist column set,
# and the orchestrator is not a sixteenth specialist (PRD §4; ADR 0001 D3).
# matrix_version stays 2: that number has
# tracked capability-ROW changes (v2 added 8 rows), and no row, no row value,
# and no member of `agents:` changed here — the orchestrator is not a matrix
# column and cannot become one without an owner decision (see the note).
# ============================================================================

