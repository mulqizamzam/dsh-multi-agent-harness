# ── per-agent sandbox + approval defaults ───────────────────────────────────
# sandbox: read-only | workspace-write | danger-full-access  (verified DSH modes)
# approval: ask | never                                     (verified DSH policies)
# These are DEFAULTS only; a project delegation may narrow them, never widen
# them (least privilege, PRD §19.9).
#
# PRD v0.2 (ADR 0003 D3): all 8 expansion roles are read-only analysts with
# approval never — they analyze, verify, and report; they never execute.

# 2026-09-07 (Human-approved discriminator, task 3 of "laksanakan 1-4"),
# extended 2026-09-09 (PRD v0.2): roles whose tool SURFACE allow sets are
# intentionally identical must be declared here; any identical pair NOT
# covered by a declared group fails validation (tests/validate_config.py).
# Every declared group's members must actually share one allow set, so a
# stale declaration also fails loudly.
tool_surface_equivalence:
  - [cfo, kai, somad, argus, atlas, scout, tess, talon]   # W-group: read-only + web_search
  - [badsector, nova, vera, quill, ledger]                # L-group: read-only, no web_search

agent_defaults:
  # Not a specialist row: the orchestrator is the coordination layer bound to
  # the root session (orchestrator/AGENT.md; ADR 0001 D3). This records the
  # ROOT SESSION's posture — it shares that session's sandbox — and is the
  # policy source for orchestrator/policy.yaml §sandbox_approval_intent and for
  # the `orchestrator` preset composition (orchestrator/agent.cordis.yml,
  # ADR 0004). It is deliberately NOT in tool_surface_equivalence: its allow set
  # matches no specialist group, and a declared group must share one allow set.
  orchestrator:
    sandbox: workspace-write  # root session: state/audit maintenance, B-lite reversible writes
    approval: ask             # HIGH-risk is never direct; authority/destructive ops ask
  zeko:
    sandbox: workspace-write
    approval: ask          # destructive/irreversible ops require human approval
  cto:
    sandbox: workspace-write
    approval: ask          # production/destructive actions require approval
  cfo:
    sandbox: read-only     # analysis only; no money movement, no mutation
    approval: never        # no execution path; cannot request escalation
  kai:
    sandbox: read-only
    approval: never        # research only; cannot execute
  somad:
    sandbox: workspace-write  # content drafting in workspace
    approval: ask             # publishing requires explicit approval
  badsector:
    sandbox: read-only
    approval: never        # reviewer; never executes the reviewed plan
  nova:
    sandbox: workspace-write  # manuscript editing in workspace
    approval: never        # internal, non-destructive file work
  vera:
    sandbox: read-only
    approval: never        # verification analyst; never executes
  argus:
    sandbox: read-only
    approval: never        # security analyst; never executes
  atlas:
    sandbox: read-only
    approval: never        # architecture analyst; never executes
  tess:
    sandbox: read-only
    approval: never        # failure analyst; never executes
  quill:
    sandbox: read-only
    approval: never        # policy/spec analyst; never executes
  scout:
    sandbox: read-only
    approval: never        # integration analyst; never executes
  talon:
    sandbox: read-only
    approval: never        # reliability analyst; never executes
  ledger:
    sandbox: read-only
    approval: never        # audit analyst; never executes

# ── orchestrator — capability boundary (record, not a matrix column) ────────
# This file is capability-MAJOR: one row per capability, keyed by the 15
# specialists, and `agents:` above is pinned to exactly that set by
# tests/validate_config.py ("perm agents list matches specialists"). The
# orchestrator cannot join the matrix as a 16th column — and no capability row
# can carry it — without an owner decision that changes that check first. What
# is recorded here is the boundary that matters, in this file's own vocabulary,
# and nothing more: direct HIGH-risk execution is `no` (it routes to a
# specialist under authority + approval — ORC-002), and delegation is
# orchestrator-only in V1 (subdelegation DENY BY DEFAULT;
# consistency_rules.delegation_orchestrator_only in role-preset-mapping.yaml).
# Machine-readable form and the full subset: orchestrator/policy.yaml
# (§capabilities, §delegation, §authority). Sources: orchestrator/AGENT.md
# §Capability boundary, ADR 0001 D3, ADR 0004 D4, THREAT-001/002, AUTH-INV-18.
orchestrator_boundary_note:
  binding: root_session
  production_deploy: "no"        # HIGH-risk class — never direct
  destructive_action: "no"       # HIGH-risk class — never direct
  financial_transaction: "no"    # HIGH-risk class — never direct
  social_publishing: "no"        # material publication — never direct
  server_read: scoped            # B-lite carve-out, through the execution gate
  code_read: scoped
  code_write: "no"               # does not execute specialist work
  web_research: scoped
  delegation: "yes"              # ORCHESTRATOR-ONLY (V1)
  subdelegation: "no"            # deny by default for all 15 specialists
  orchestration_workflow: "yes"  # fan-out/collect; NOT a security boundary

# Invariants (enforced by tests/validate-config.py)
invariants:
  no_agent_grants_itself_authority: true
  badsector_never_executes: true          # read-only + approval never
  kai_never_executes: true                # read-only + approval never
  cfo_no_transaction_by_default: true
  destructive_always_requires_approval_or_denied: true
  adversarial_review_reserved_to_badsector: true
  expansion_analysts_read_only: true      # all 8 PRD v0.2 roles: read-only + never
