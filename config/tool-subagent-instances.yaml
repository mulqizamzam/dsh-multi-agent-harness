# Consistency guardrails (validated by tests/validate_config.py):
consistency_rules:
  single_delegation_row: true       # exactly one tool-subagent row
  agent_presets_cover_roster: true  # the allowlist names all 15 role presets
  instance_matches_role_mapping: true
  matches_role_policy_yaml: true     # each role's allow/deny == policy.yaml
  matches_preset_composition: true  # each role's tool plugins == what its
                                     # preset composition actually mounts
  delegation_deny_by_default: true  # no delegation tool in any specialist
  tool_names_verified: true          # against the DSH 0.2.1-rc.2 catalog
