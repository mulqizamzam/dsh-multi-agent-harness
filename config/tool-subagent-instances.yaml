# ============================================================================
# Delegation tool + Agent Preset declarations — multi-agent-harness
#
# REWRITTEN 2026-10-21 for DeepSeek Harness 0.2.1-rc.2.
#
# What changed in the host:
#   - `@deepseek-ai/dsh-tool-subagent` REMOVED the per-instance `persona` and
#     `toolFilter` config keys. It now throws at config time
#     ("tool-subagent: persona is no longer supported; configure persona and
#     tool plugins in an Agent Preset and select it with agentPreset"), so a
#     row carrying either of them FAILS TO MOUNT.
#   - It REMOVED `backgroundMode` and the `enableRunInBackground` config key.
#     Continuability is now a provider capability (`prepareContinuable`), not a
#     row setting.
#   - The model-facing `run_in_background` argument is gone; role selection is
#     the `agent_preset` argument.
#
# What this file therefore records:
#   `insert_draft`   the ONE delegation tool the orchestrator holds, with the
#                    Agent Presets it may select.
#   `agent_presets`  the fifteen role presets, each with the tool PLUGINS whose
#                    rows compose the role's tool surface. The old
#                    `toolFilter.allow` list became exactly this set:
#                    a tool name maps to the plugin that provides it, and the
#                    plugin's own per-tool config narrows it further.
#
# The tool -> plugin map (verified against the 0.2.1-rc.2 packages):
#   bash                            -> @deepseek-ai/dsh-tool-bash
#   read, read_image                -> @deepseek-ai/dsh-tool-fs
#   write, edit                     -> @deepseek-ai/dsh-tool-fs
#   glob, grep                      -> @deepseek-ai/dsh-tool-fs-search
#   job_kill, job_list, job_output  -> @deepseek-ai/dsh-tool-jobs
#   skill                           -> @deepseek-ai/dsh-tool-skill
#   exit_plan_mode                  -> @deepseek-ai/dsh-plan-mode
#   web_search, web_fetch           -> @deepseek-ai/dsh-tool-web
#   todo_write                      -> @deepseek-ai/dsh-tool-todo
#
# GRANULARITY: a plugin provides several tools, so mounting it exposes all of
# them. That loss is NOT suffered here, because 0.2.1-rc.2 gave the two
# multi-tool plugins this roster uses a per-tool config:
#   - `@deepseek-ai/dsh-tool-fs`  -> read / readImage / write / edit
#   - `@deepseek-ai/dsh-tool-web` -> search / fetch
# The `tool_surface` rows below record those switches, so each role's mounted
# tool set equals its old allow list exactly.
#
# SUBDelegation DENY BY DEFAULT is now structural rather than a deny list: a
# role preset mounts no delegation plugin at all, and the one delegation tool
# carries `maxDepth: 1`, so a second hop is rejected at start. The fourteen
# sibling `subagent_<id>` deny entries the old rows carried are obsolete —
# those tools no longer exist — and are gone.
# ============================================================================

draft_version: 3
status: mounted
version_pin: deepseek-harness-0.2.1-rc.2
mapping_ref: config/role-preset-mapping.yaml
policy_ref_prefix: agents/       # <id>/policy.yaml
preset_ref_prefix: agents/       # <id>/agent.cordis.yml

# The row set mounted into the orchestrator preset composition
# (orchestrator/agent.cordis.yml, in the `delegation` group). ONE row, ONE
# model-facing tool: the model names the role in `agent_preset`.
insert_draft:
  - id: tool-subagent
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: spawn
      toolName: subagent
      maxDepth: 1
      allowedAgentPresets:
          - role-zeko
          - role-cto
          - role-cfo
          - role-kai
          - role-somad
          - role-badsector
          - role-nova
          - role-vera
          - role-argus
          - role-atlas
          - role-tess
          - role-quill
          - role-scout
          - role-talon
          - role-ledger

# The fifteen Agent Presets the delegation tool can select. Each is
# registered by this plugin from the `source` composition file (id
# `role-<id>`), and each carries its persona in a `@deepseek-ai/dsh-persona`
# row and its tool surface in the tool plugin rows listed here.
agent_presets:
  - id: role-zeko
    source: agents/zeko/agent.cordis.yml
    policy_ref: agents/zeko/policy.yaml
    persona_row: persona
    tool_surface:
      allow: [bash, read, read_image, glob, grep, job_kill, job_list, job_output, web_search, skill, exit_plan_mode, todo_write]
      deny: []
    tool_plugins:
      - '@deepseek-ai/dsh-plan-mode'
      - '@deepseek-ai/dsh-tool-bash'
      - '@deepseek-ai/dsh-tool-fs'
      - '@deepseek-ai/dsh-tool-fs-search'
      - '@deepseek-ai/dsh-tool-jobs'
      - '@deepseek-ai/dsh-tool-skill'
      - '@deepseek-ai/dsh-tool-todo'
      - '@deepseek-ai/dsh-tool-web'
    tool_fs_config: {read: true, readImage: true, write: false, edit: false}
    tool_web_config: {search: true, fetch: false}
  - id: role-cto
    source: agents/cto/agent.cordis.yml
