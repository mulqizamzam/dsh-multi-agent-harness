# Consistency guardrails (validated by tests/validate-config.py):
consistency_rules:
  instance_allow_deny_disjoint: true
  instance_matches_role_mapping: true   # each instance's allow/deny == role-preset-mapping entry
  matches_role_policy_yaml: true        # transitive via mapping == policy
  delegation_deny_by_default: true      # no delegation tool in any specialist allow
  tool_names_verified: true             # against docs/tool-catalog.md (0.1.1-rc.2)
