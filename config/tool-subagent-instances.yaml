# ============================================================================
# Per-role tool-subagent instances (subagent_<id>)
# MOUNTED 2026-09-07 in the live web profile composition
# ($DSH_HOME/profiles/web/cordis.patch.yml) under the Human-approved D4/D7
# composition exception (ADR Decision 4/7). Verification evidence:
# runs/mount-verification-2026-09-07/. This file remains the composition
# source-of-record; further composition changes are per-case exceptions.
#
# Originally authored as the Phase 1C DRAFT (see
# docs/phase-1/0002-role-isolation-draft.md); written in cordis patch style.
#
# Config keys VERIFIED against the DSH 0.1.1-rc.2 tool-subagent source:
#   provider, toolName, persona, toolFilter {allow, deny}, backgroundMode,
#   maxDepth, enableRunInBackground (default true).
#
# Rules preserved:
#   - subdelegation DENY BY DEFAULT: every specialist deny list names exactly
#     its six sibling subagent_<id> instances (the real delegation surface —
#     restriction matching is exact-name, so the generic "subagent" deny never
#     blocked subagent_<id>), and no delegation tool appears in any allow set.
#     Generic workflow-realm tools (subagent, subagent_fork, send_message,
#     interrupt_agent, list_agents, workflow, ralph) are NOT deny entries:
#     they register in the standard preset's workflow isolate realm, outside a
#     specialist child's inherited chain, and tools.restrict() rejects them.
#   - toolFilter allow∩deny = ∅ (validated by tests/validate-config.py).
#   - read-only roles (cfo, kai, badsector) deny edit/write/bash even though
#     tool-fs is mounted in their preset (tool-fs is atomic — VERIFIED).
#   - deny vocabulary is canonical and matches the deployed live profile
#     composition ($DSH_HOME/profiles/web/cordis.patch.yml) row for row
#     (locked by tests/l3_runner/.../test_live_rows_match_config).
# ============================================================================

draft_version: 1
status: mounted           # was: draft — mounted 2026-09-07 (Human-approved D4/D7)
version_pin: deepseek-harness-0.1.1-rc.2
mapping_ref: config/role-preset-mapping.yaml
policy_ref_prefix: agents/  # <id>/policy.yaml

# The insert block below is the row set executed into the live profile
# composition on 2026-09-07 (was: a Phase 1C projection).
insert_draft:
  - id: tool-subagent-zeko
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: spawn
      toolName: subagent_zeko
      persona: role-zeko
      backgroundMode: continuable
      maxDepth: 1
      toolFilter:
        # 2026-09-07 (Human-approved discriminator): edit/write removed —
        # capabilities.code_write: no is now enforceable at the toolFilter
        # layer; raw-write actor set {zeko, cto} -> {cto}.
        allow: [bash, read, read_image, glob, grep,
                job_kill, job_list, job_output,
                web_search, skill, exit_plan_mode, todo_write]
        deny: [subagent_cto, subagent_cfo, subagent_kai,
               subagent_somad, subagent_badsector, subagent_nova]

