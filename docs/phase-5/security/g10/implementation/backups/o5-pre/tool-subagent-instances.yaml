# ============================================================================
# DRAFT — Per-role tool-subagent instances (subagent_<id>)
# NOT MOUNTED. Draft composition artifact for the controlled DSH composition
# exception (ADR Decision 4/7). See docs/phase-1/0002-role-isolation-draft.md.
#
# This file is a DRAFT of the `- insert:` rows that WOULD be added to a profile
# composition (e.g. a project overlay / profile cordis.patch.yml) to expose the
# seven specialist roles to the orchestrator as per-role tool-subagent
# instances. It is intentionally written in cordis patch style.
#
# Config keys VERIFIED against the DSH 0.1.1-rc.2 tool-subagent source:
#   provider, toolName, persona, toolFilter {allow, deny}, backgroundMode,
#   maxDepth, enableRunInBackground (default true).
#
# Rules preserved:
#   - subdelegation DENY BY DEFAULT: specialists never expose subagent/fork/
#     workflow/send_message etc. (they are in every specialist DENY set).
#   - toolFilter allow∩deny = ∅ (validated by tests/validate-config.py).
#   - read-only roles (cfo, kai, badsector) deny edit/write/bash even though
#     tool-fs is mounted in their preset (tool-fs is atomic — VERIFIED).
# ============================================================================

draft_version: 1
status: draft            # NOT mounted
version_pin: deepseek-harness-0.1.1-rc.2
mapping_ref: config/role-preset-mapping.yaml
policy_ref_prefix: agents/  # <id>/policy.yaml

# The insert block below is what a controlled exception WOULD add to a profile
# composition. NOT EXECUTED in Phase 1C.
insert_draft:
  - id: tool-subagent-zeko
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: spawn
      toolName: subagent_zeko
      persona: role-zeko
      backgroundMode: continuable
      maxDepth: 1
      toolFilter:
        allow: [bash, read, read_image, edit, write, glob, grep,
                job_kill, job_list, job_output,
                web_search, skill, exit_plan_mode, todo_write]
        deny: [subagent, subagent_fork, send_message, interrupt_agent, list_agents,
               workflow, ralph, ask_user_question,
               create_goal, get_goal, update_goal]

