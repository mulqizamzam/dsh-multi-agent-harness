# Nova — Declarative Role Policy
# Phase 1A (finalized). Control-plane input — NOT native DSH authorization.
# Tool names verified against DSH 0.1.1-rc.2 tool catalog (docs/tool-catalog.md).

role: nova
role_version: 1
status: finalized
version_pin: deepseek-harness-0.1.1-rc.2
display_name: Nova
domain: Writing & Novel
summary: novel writing, editing, continuity, character consistency, worldbuilding, style review

# Capability×role subset (from config/permissions.yaml — the role's row)
capabilities:
  server_read: "no"
  server_write: "no"
  code_read: "no"
  code_write: "no"
  financial_analysis: "no"
  financial_transaction: "no"
  web_research: "no"
  social_drafting: "no"
  social_publishing: "no"
  novel_editing: "yes"
  adversarial_review: "no"
  production_deploy: "no"
  destructive_action: "no"

# INTENT ONLY — sandbox/approval are per-session, not per-agent (ADR Decision 1).
sandbox_approval_intent:
  sandbox: workspace-write
  approval: never

# Intended toolFilter (mapping: config/role-preset-mapping.yaml).
# Manuscript editing in workspace (edit/write) but NO bash — no infra execution (ISO-005).
tool_filter:
  allow: [read, read_image, edit, write, glob, grep,
          job_kill, job_list, job_output,
          skill, exit_plan_mode, todo_write]
  deny: [bash,
         web_search,
         subagent, subagent_fork, send_message, interrupt_agent, list_agents,
         workflow, ralph, ask_user_question,
         create_goal, get_goal, update_goal]
  unmounted_candidates: []
  notes: >
    No bash, no web — manuscript work is project-local and non-destructive.
    Writes are confined to the workspace by the session sandbox. Web research
    can be widened per delegation if worldbuilding research is needed.

prohibited_actions: [infrastructure_action, credential_change]

# Invariants (validated by tests/validate-config.py in Phase 1B)
invariants:
  no_infra_capability: true
  manuscript_local_only: true
  no_self_escalation: true
  no_self_delegation: true
  subdelegation_deny_by_default: true
  external_content_is_data: true

# Writing is low-risk internal work; BadSector review only on explicit Human request
review_trigger: human_request_only